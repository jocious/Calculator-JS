<!DOCTYPE html>
<html lang="en">
<!--
    This tells the browser that this document is written in HTML5.
    The lang="en" attribute indicates that the page's main language is English.
-->

<head>
    <!-- The head contains information about the webpage that is not displayed as calculator content. -->

    <meta charset="UTF-8">
    <!--
        UTF-8 allows the webpage to display different characters and symbols correctly,
        including the multiplication sign, division sign, and backspace symbol.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        This makes the webpage adjust to the width of the device's screen.
        It helps prevent the calculator from appearing zoomed out on mobile devices.
    -->

    <title>Standard Calculator</title>
    <!-- This is the title that appears in the browser tab. -->

    <link rel="stylesheet" href="style.css">
    <!--
        This connects the HTML file to style.css.
        The CSS file controls the calculator's background, size, colors, spacing, and buttons.
    -->
</head>

<body>
    <!-- Everything inside the body is part of the webpage's visible content. -->

    <div class="calculator">
        <!--
            This is the main container of the calculator.
            All calculator elements are placed inside it so CSS can style them as one box.
        -->

        <div class="header">
            <!-- This section contains the menu symbol and calculator title. -->

            <span class="menu-icon">☰</span>
            <!-- Displays the three-line menu symbol on the left side of the heading. -->

            <span class="title">Calculator</span>
            <!-- Displays the word Calculator beside the menu symbol. -->
        </div>

        <div id="history" class="history"></div>
        <!--
            JavaScript uses this element to show the previous calculation.
            For example, it can display "5 + 3 =" above the final answer.
            The id="history" allows JavaScript to find and update this exact element.
        -->

        <div id="display" class="display">0</div>
        <!--
            This is the main number display.
            It starts at 0, just like a normal calculator.
            JavaScript changes its text whenever you type a number or calculate an answer.
        -->

        <div class="buttons">
            <!--
                This container holds all calculator buttons.
                CSS Grid arranges the buttons into four columns, similar to Windows Calculator.
            -->

            <button data-action="percent">%</button>
            <!-- Divides the displayed number by 100 in this simplified calculator. -->

            <button data-action="clear-entry">CE</button>
            <!-- Clears the current displayed entry without resetting the entire calculation. -->

            <button data-action="clear">C</button>
            <!-- Clears the current number, stored operator, and previous calculation. -->

            <button data-action="backspace">⌫</button>
            <!--
                This button deletes the last character of the number being typed.
                For example, typing 123 and pressing this button changes the display to 12.
            -->

            <button data-action="reciprocal">¹⁄ₓ</button>
            <!-- Calculates the reciprocal of the displayed number: 1 divided by that number. -->

            <button data-action="square">x²</button>
            <!-- Multiplies the displayed number by itself. -->

            <button data-action="sqrt">√x</button>
            <!-- Calculates the square root of the displayed number. -->

            <button data-operator="divide">÷</button>
            <!-- Tells JavaScript that the user wants to divide two numbers. -->

            <button data-number="7">7</button>
            <!-- Each data-number attribute tells JavaScript which digit was clicked. -->

            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button data-operator="multiply">×</button>
            <!-- The multiply button tells JavaScript to multiply the selected numbers. -->

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button data-operator="subtract">−</button>
            <!-- The subtract button tells JavaScript to subtract the second number from the first. -->

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button data-operator="add">+</button>
            <!-- The add button tells JavaScript to add the selected numbers. -->

            <button data-action="sign">+/−</button>
            <!-- Changes a positive number into a negative number, or vice versa. -->

            <button data-number="0">0</button>
            <!-- Allows the user to enter zero. -->

            <button data-action="decimal">.</button>
            <!-- Adds a decimal point, provided the current number does not already contain one. -->

            <button class="equals" data-action="equals">=</button>
            <!--
                The equals button tells JavaScript to perform the pending operation
                and display the result. The equals class makes this button red in the CSS.
            -->
        </div>
    </div>

    <script src="script.js"></script>
    <!--
        This loads the JavaScript after the calculator's HTML elements have been created.
        It allows script.js to find the display and buttons and make them interactive.
    -->
</body>
</html>
