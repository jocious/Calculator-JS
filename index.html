<!DOCTYPE html>
<html>

<head>

    <!-- Name shown on the browser tab -->
    <title>JavaScript Calculator</title>

    <!-- Connect HTML to CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Main calculator -->
    <div class="calculator">


        <!-- Top bar -->
        <div class="top">

            <!-- Menu icon -->
            <span>☰</span>

            <!-- Calculator type -->
            <b>Standard</b>

        </div>


        <!-- Display -->
        <div class="display">

            <!-- Shows previous calculation -->
            <div id="history"></div>

            <!-- Shows current number -->
            <div id="display">0</div>

        </div>


        <!-- Memory buttons -->
        <div class="memory">

            <!-- Disabled memory buttons -->
            <button disabled>MC</button>
            <button disabled>MR</button>
            <button disabled>M+</button>
            <button disabled>M−</button>
            <button disabled>MS</button>
            <button disabled>M⌄</button>

        </div>


        <!-- Calculator buttons -->
        <div class="buttons">


            <!-- First row -->

            <button onclick="percent()">%</button>

            <button onclick="clearEntry()">CE</button>

            <button onclick="clearAll()">C</button>

            <button onclick="backspace()">⌫</button>


            <!-- Second row -->

            <!-- Disabled 1/x -->
            <button class="disabled-button" disabled>¹⁄ₓ</button>

            <!-- Disabled x² -->
            <button class="disabled-button" disabled>x²</button>

            <!-- Disabled square root -->
            <button class="disabled-button" disabled>√x</button>

            <!-- Division -->
            <button onclick="chooseOperator('/')">÷</button>


            <!-- Third row -->

            <button onclick="addNumber('7')">7</button>

            <button onclick="addNumber('8')">8</button>

            <button onclick="addNumber('9')">9</button>

            <button onclick="chooseOperator('*')">×</button>


            <!-- Fourth row -->

            <button onclick="addNumber('4')">4</button>

            <button onclick="addNumber('5')">5</button>

            <button onclick="addNumber('6')">6</button>

            <button onclick="chooseOperator('-')">−</button>


            <!-- Fifth row -->

            <button onclick="addNumber('1')">1</button>

            <button onclick="addNumber('2')">2</button>

            <button onclick="addNumber('3')">3</button>

            <button onclick="chooseOperator('+')">+</button>


            <!-- Last row -->

            <button onclick="changeSign()">+/−</button>

            <button onclick="addNumber('0')">0</button>

            <button onclick="addNumber('.')">.</button>

            <!-- Equals -->
            <button class="equals" onclick="calculate()">=</button>


        </div>

    </div>


    <!-- Connect HTML to JavaScript -->
    <script src="script.js"></script>

</body>

</html>
